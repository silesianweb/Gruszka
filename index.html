const nativeHTML = Object.getOwnPropertyDescriptor(Element.prototype, 'innerHTML');
function syncAttrs(a, b){
  const keepImg = a.tagName === 'IMG' && a.dataset.pid && a.dataset.pid === b.getAttribute('data-pid');
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name) && !(keepImg && (at.name === 'src' || at.name === 'data-loaded'))) a.removeAttribute(at.name);
  for (const at of b.attributes) if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);

  const nb = [...b.childNodes];
  nb.forEach((n, i) => {
    const o = a.childNodes[i];
    if (!o) { a.appendChild(n); return; }
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || (o.id || '') !== (n.id || '')) { a.replaceChild(n, o); return; }
    if (o.nodeType !== 1) { if (o.nodeValue !== n.nodeValue) o.nodeValue = n.nodeValue; return; }

      if (!sameView) { if (tag === 'INPUT' && (o.type === 'checkbox' || o.type === 'radio')) o.checked = n.hasAttribute('checked');
        else if (tag === 'TEXTAREA') o.value = n.textContent; else if (tag === 'INPUT') o.value = n.getAttribute('value') || ''; }

// ---------- godzina i przewidywany czas ----------
const DURS = [[0,'nie wiem'],[30,'30 min'],[60,'1 godz.'],[90,'1,5 godz.'],[120,'2 godz.'],[150,'2,5 godz.'],[180,'3 godz.'],[240,'4 godz.'],[300,'5 godz.'],[360,'6 godz.'],[480,'cały dzień']];

const sirenOn = () => { try { return localStorage.getItem('gruszka-siren') !== '0'; } catch(e) { return true; } };
const setSiren = on => { try { localStorage.setItem('gruszka-siren', on ? '1' : '0'); } catch(e) {} };
function playSiren(){
  if (!sirenOn()) return;
  try {
    const A = window.AudioContext || window.webkitAudioContext; if (!A) return;
    const ctx = new A(), t0 = ctx.currentTime, len = 1.8;
    const osc = ctx.createOscillator(), lp = ctx.createBiquadFilter(), g = ctx.createGain();
    osc.type = 'square'; lp.type = 'lowpass'; lp.frequency.value = 1800;
    for (let i = 0; i < 4; i++) osc.frequency.setValueAtTime(i % 2 ? 622 : 466, t0 + i * 0.45);   // „i-u, i-u” jak wóz strażacki
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.18, t0 + 0.05);
    g.gain.setValueAtTime(0.18, t0 + len - 0.25); g.gain.linearRampToValueAtTime(0, t0 + len);
    osc.connect(lp); lp.connect(g); g.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + len + 0.05); osc.onended = () => ctx.close();
    navigator.vibrate?.(200);
  } catch(e) {}
}

let pdb;
const pdbReady = new Promise(r => {
  const o = indexedDB.open('ogrod-zdjecia', 1);
  o.onupgradeneeded = e => e.target.result.createObjectStore('p', { keyPath: 'id' });
  o.onsuccess = e => { pdb = e.target.result; navigator.storage?.persist?.(); r(); };
});
const ps = m => pdb.transaction('p', m).objectStore('p');
const idbPut = rec => new Promise(r => { ps('readwrite').put(rec).onsuccess = r; });
const idbGet = id => new Promise(r => { const q = ps('readonly').get(id); q.onsuccess = () => r(q.result); });
const idbAll = () => new Promise(r => { const q = ps('readonly').getAll(); q.onsuccess = () => r(q.result); });
const photoDoc = id => doc(fs, 'users', user.uid, 'photos', id);

async function upload(rec){
  try { await setDoc(photoDoc(rec.id), { data: rec.data }); await idbPut({ ...rec, up: true }); } catch(e) {}
}
const photoMem = new Map(), photoWait = new Map();
const memPut = (id, d) => { photoMem.delete(id); photoMem.set(id, d); if (photoMem.size > 150) photoMem.delete(photoMem.keys().next().value); };
async function putPhoto(id, data){
  memPut(id, data);
  await pdbReady; const rec = { id, data, up: false };
  await idbPut(rec); upload(rec);
}
async function getPhoto(id){
  if (photoMem.has(id)) return photoMem.get(id);
  if (photoWait.has(id)) return photoWait.get(id);
  const job = (async () => {
    await pdbReady;
    const r = await idbGet(id); if (r) return r.data;
    try { const sn = await getDoc(photoDoc(id));
      if (sn.exists()) { const data = sn.data().data; await idbPut({ id, data, up: true }); return data; } } catch(e) {}
    return null;
  })().then(d => { photoWait.delete(id); if (d) memPut(id, d); return d; });
  photoWait.set(id, job); return job;
}
async function delPhoto(id){
  photoMem.delete(id);
  await pdbReady;
  await new Promise(r => { ps('readwrite').delete(id).onsuccess = r; });
  deleteDoc(photoDoc(id)).catch(() => {});
}
async function syncPhotos(){
  await pdbReady;
  for (const r of await idbAll()) if (!r.up) await upload(r);
}
const showImg = async im => { const id = im.dataset.pid, d = await getPhoto(id); if (d && im.dataset.pid === id) { im.src = d; im.dataset.loaded = id; } };
const imgIO = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { imgIO.unobserve(e.target); showImg(e.target); } }), {rootMargin: '300px 0px'}) : null;
function loadImgs(root = app){

    im.loading = 'lazy'; im.decoding = 'async';

  });
}
function shrink(file){return new Promise(r=>{const img=new Image();img.onload=()=>{
  const max=1000,s=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=img.width*s;c.height=img.height*s;
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',0.7));
  URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(file)})}

const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=49.9611&longitude=18.775&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max&timezone=Europe%2FWarsaw&forecast_days=7';
let wx = (() => { try { return JSON.parse(localStorage.getItem('gruszka-wx')) || null; } catch(e) { return null; } })(), wxBusy = false;
function loadWx(){
  if (wxBusy || (wx && Date.now() - wx.t < 3600e3)) return;
  wxBusy = true;
  fetch(WX_URL).then(r => r.json()).then(j => {
    const d = j.daily, days = {};
    d.time.forEach((t, i) => days[t] = {c: d.weather_code[i], hi: d.temperature_2m_max[i], lo: d.temperature_2m_min[i], p: d.precipitation_sum[i], pp: d.precipitation_probability_max[i]});

}
const wxDay = d => wx && wx.days ? wx.days[d] : null;
const wxIcon = c => c === 0 ? '☀️' : c <= 2 ? '🌤' : c === 3 ? '☁️' : c <= 48 ? '🌫' : c <= 57 ? '🌦' : c <= 67 ? '🌧' : c <= 77 ? '🌨' : c <= 82 ? '🌧' : c <= 86 ? '🌨' : '⛈';
const wxName = c => c === 0 ? 'bezchmurnie' : c <= 2 ? 'trochę chmur' : c === 3 ? 'pochmurno' : c <= 48 ? 'mgła' : c <= 57 ? 'mżawka' : c <= 67 ? 'deszcz' : c <= 77 ? 'śnieg' : c <= 82 ? 'przelotne opady' : c <= 86 ? 'śnieg' : 'burza';
const wxBad = w => !!w && (w.pp >= 60 || w.p >= 3 || w.c >= 95);

function compareView(v, title){
  const B = v.before || [], A = v.after || []; if (!B.length || !A.length) return;
  let bi = 0, ai = 0, pos = 50;
  const [w, q] = sheet(`<div class="row" style="margin-bottom:8px"><h3 style="margin:0">🔀 Przed / po</h3><span class="muted">${esc(title)}</span></div>

      <div class="bar" id="bar"></div><div class="knob" id="knob">↔</div></div>
    <p class="muted" style="text-align:center;margin:6px 0">Przesuwaj palcem po zdjęciu</p>
    ${B.length > 1 ? `<label>Zdjęcie przed</label><div class="thumbs" id="tb">${B.map((p, i) => `<img data-pid="${p}" data-i="${i}" class="${i ? '' : 'on'}">`).join('')}</div>` : ''}
    ${A.length > 1 ? `<label>Zdjęcie po</label><div class="thumbs" id="ta">${A.map((p, i) => `<img data-pid="${p}" data-i="${i}" class="${i ? '' : 'on'}">`).join('')}</div>` : ''}
    <button class="btn" id="shr">📤 Udostępnij zdjęcie przed i po</button><button class="btn sec" id="cls">Zamknij</button>`);
  const src = {};
  const load = async id => src[id] || (src[id] = await getPhoto(id));
  const show = async () => { q('ib').src = await load(B[bi]) || ''; q('ia').src = await load(A[ai]) || ''; };
  const setPos = p => { pos = Math.max(0, Math.min(100, p)); q('ib').style.clipPath = `inset(0 ${100 - pos}% 0 0)`; q('bar').style.left = pos + '%'; q('knob').style.left = pos + '%'; };
  const box = q('cmp');
  const mv = e => { const r = box.getBoundingClientRect(); setPos((e.clientX - r.left) / r.width * 100); };
  box.addEventListener('pointerdown', e => { box.setPointerCapture(e.pointerId); mv(e); });
  box.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') mv(e); });
  w.querySelectorAll('.thumbs img').forEach(async im => { im.src = await load(im.dataset.pid) || ''; im.onclick = () => {
    const isB = im.parentElement.id === 'tb'; if (isB) bi = +im.dataset.i; else ai = +im.dataset.i;
    im.parentElement.querySelectorAll('img').forEach(x => x.classList.toggle('on', x === im)); show(); }; });
  setPos(50); show();
  q('cls').onclick = () => w.remove();
  q('shr').onclick = async () => {
    const [b, a] = await Promise.all([load(B[bi]), load(A[ai])]); if (!b || !a) return;
    const img = s => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = s; });
    const [ib, ia] = await Promise.all([img(b), img(a)]);
    const W = 720, H = 960, cv = document.createElement('canvas'); cv.width = W * 2 + 12; cv.height = H; const x = cv.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, H);
    const draw = (im, dx) => { const s = Math.max(W / im.width, H / im.height), w2 = W / s, h2 = H / s;
      x.drawImage(im, (im.width - w2) / 2, (im.height - h2) / 2, w2, h2, dx, 0, W, H); };
    draw(ib, 0); draw(ia, W + 12);
    x.font = 'bold 44px -apple-system, sans-serif';
    [['PRZED', 24], ['PO', W + 36]].forEach(([t, dx]) => { const tw = x.measureText(t).width;
      x.fillStyle = '#000a'; x.fillRect(dx - 12, 20, tw + 24, 62); x.fillStyle = '#fff'; x.fillText(t, dx, 68); });
    cv.toBlob(async blob => {
      const file = new File([blob], 'przed-po.jpg', {type: 'image/jpeg'});
      try { if (navigator.canShare && navigator.canShare({files: [file]})) return await navigator.share({files: [file], title: 'Przed i po'}); } catch(e) { return; }
      const u = URL.createObjectURL(blob), l = document.createElement('a'); l.href = u; l.download = 'przed-po.jpg'; l.click(); setTimeout(() => URL.revokeObjectURL(u), 5000);
    }, 'image/jpeg', 0.85);
  };
}

function markPaid(cid, vid, paid){
  const c = findClient(cid); if (!c) return;

  if (paid && v.amount == null) {
    const a = prompt('Ile zapłacił klient? (zł)', c.price ?? ''); if (a === null) return;
    const k = a.trim().replace(',', '.'); if (k === '' || isNaN(+k)) return alert('Wpisz kwotę (może być 0).');

    return {from, to, label: shortDate(from).replace(/ \d{4}$/, '') + ' – ' + shortDate(to), word: 'w tym tygodniu'}; }
  return {from: ymd(new Date(y, m, 1)), to: ymd(new Date(y, m + 1, 0)), label: d.toLocaleDateString('pl-PL', {month: 'long', year: 'numeric'}), word: 'w tym miesiącu'};

function showTeam(){
  view = showTeam; tab('team'); head('Czas pracy');
  const now = new Date(), today = ymd(now);
  const ws = addDays(today, -((now.getDay() + 6) % 7)), we = addDays(ws, 6);
  const mk = today.slice(0, 7), yk = today.slice(0, 4);
  const per = [['Tydzień', d => d >= ws && d <= we], ['Miesiąc', d => d.startsWith(mk)], ['Rok', d => d.startsWith(yk)]];
  const doneV = []; clients.forEach(c => (c.visits||[]).forEach(v => { if (v.done) doneV.push(v); }));
  const sumP = fn => per.map(([, f]) => doneV.filter(v => f(v.date)).reduce((s, v) => s + fn(v), 0));
  const mine = sumP(hoursOf);
  const allV = []; clients.forEach(c => (c.visits||[]).forEach(v => allV.push(v)));
  const income = sumP(v => v.paid ? +v.amount || 0 : 0);
  const out = per.map(([, f]) => allV.reduce((s, v) => s + paidOutBy(v, f), 0)), net = income.map((x, i) => x - out[i]);
  const hOf = id => sumP(v => (v.helpers || []).filter(h => h.id === id).reduce((t, h) => t + (+h.hours || 0), 0));
  const pOf = id => per.map(([, f]) => allV.reduce((s, v) => s + (v.helpers || []).filter(h => h.id === id && h.paidOut && f(h.paidOutAt || v.date)).reduce((t, h) => t + (+h.pay || 0), 0), 0));
  const owedOf = id => allV.reduce((s, v) => s + (v.helpers || []).filter(h => h.id === id && !h.paidOut).reduce((t, h) => t + (+h.pay || 0), 0), 0);

    `<div class="stat" style="padding:8px"><span class="muted" style="font-size:13px">${per[i][0]}</span><b style="font-size:17px;${col ? 'color:' + col : ''}">${f(h)}</b></div>`).join('')}</div>`;
  const hs = settings.helpers || [];
  app.innerHTML = `<div class="card"><b>⏱ Twój czas pracy</b>${stats(mine, fmtH)}
      <p class="muted" style="margin:6px 0 0;font-size:13px">Tydzień: ${shortDate(ws)} – ${shortDate(we)}. Liczone z pola „Usługa trwała”.</p></div>
    <div class="card"><b>💰 Twój zarobek</b> <span class="muted" style="font-size:13px">(wpłaty minus wypłacone pomocnikom)</span>${stats(net, zl, 'var(--g)')}
      <div class="muted" style="font-size:13px;margin-top:6px">${per.map((p, i) => `${p[0]}: wpłynęło ${zl(income[i])}, wypłacono ${zl(out[i])}`).join('<br>')}</div></div>
    <h3>👷 Pomocnicy</h3>
    ${hs.map(h => `<div class="card"><div class="row"><b style="font-size:17px">${esc(h.name)}</b>
        <span style="display:flex;gap:6px;flex:none"><button class="btn sec" style="width:auto;margin:0;padding:6px 10px;font-size:14px" data-ren="${h.id}">✏️</button>
        <button class="btn del" style="width:auto;margin:0;padding:6px 10px;font-size:14px" data-del="${h.id}">🗑</button></span></div>
        <div class="muted" style="font-size:13px;margin-top:6px">Godziny</div>${stats(hOf(h.id), fmtH)}
        <div class="muted" style="font-size:13px;margin-top:8px">Wypłacono</div>${stats(pOf(h.id), zl, '#e65100')}
        ${owedOf(h.id) ? `<p style="margin:8px 0 0;color:#e65100;font-weight:600">Do wypłaty: ${zl(owedOf(h.id))} <a href="#" data-gopay>› Płatności</a></p>` : ''}</div>`).join('')
      || '<p class="muted">Nie masz jeszcze pomocników.</p>'}

      <div style="display:flex;gap:8px"><input id="hn" placeholder="Imię, np. Kasia" style="margin:0"><button class="btn" style="width:auto;margin:0;padding:0 18px" id="ha">+</button></div></div>
    <p class="muted" style="font-size:13px">Pomocników zaznaczasz w okienku po odhaczeniu wizyty (✓): wpisujesz ich godziny i ile im się należy. Wypłacasz w Płatnościach przyciskiem „Zapłać” – dopiero wtedy kwota odlicza się od Twojego zarobku.</p>`;
  app.querySelectorAll('[data-gopay]').forEach(a => a.onclick = e => { e.preventDefault(); showPay(); });
  $('ha').onclick = () => { const n = $('hn').value.trim(); if (!n) return;

    const h = hs.find(x => x.id === b.dataset.ren); const n = prompt('Nowe imię:', h.name); if (!n || !n.trim()) return;

function deleteVisit(cid, vid){

  [...(v.before||[]), ...(v.after||[])].forEach(delPhoto);

function bindSwipe(onOpen){
  let openEl = null;
  const close = el => { if (el) { el.style.transform = ''; if (openEl === el) openEl = null; } };
  app.querySelectorAll('.sw').forEach(w => {
    const card = w.querySelector('.swc');
    if (card.dataset.sw) return; card.dataset.sw = '1';
    let x0 = 0, y0 = 0, dx = 0, drag = false, moved = false, startOpen = false;
    card.addEventListener('pointerdown', e => {
      x0 = e.clientX; y0 = e.clientY; dx = 0; drag = true; moved = false; startOpen = openEl === card;
      if (openEl && openEl !== card) close(openEl);
      card.style.transition = 'none';
    });
    let raf = 0;
    card.addEventListener('pointermove', e => {
      if (!drag) return;
      const mx = e.clientX - x0, my = e.clientY - y0;
      if (!moved && Math.abs(mx) < 8) return;
      if (!moved && Math.abs(my) > Math.abs(mx)) { drag = false; return; }
      moved = true; dx = Math.max(-110, Math.min(0, mx + (startOpen ? -96 : 0)));
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; card.style.transform = `translate3d(${dx}px,0,0)`; });
    }, {passive: true});
    const end = () => {
      if (!drag) return; drag = false; if (raf) { cancelAnimationFrame(raf); raf = 0; } card.style.transition = '';
      if (!moved) return;
      if (dx < -48) { card.style.transform = 'translateX(-96px)'; openEl = card; } else close(card);
    };
    card.addEventListener('pointerup', end); card.addEventListener('pointercancel', end);
    card.addEventListener('click', () => {
      if (moved) { moved = false; return; }
      if (openEl) { close(openEl); return; }
      onOpen(w.dataset.c, w.dataset.v);
    });
    w.querySelector('.swdel').onclick = () => {
      const prev = findClient(w.dataset.c), cc = findClient(w.dataset.c); if (!cc) return;
      const v = (cc.visits || []).find(x => x.id === w.dataset.v); if (!v) return;
      cc.visits = cc.visits.filter(x => x.id !== v.id); saveClient(cc); showHistory();
      toastUndo(`Usunięto wpis: ${esc(cc.name)}, ${shortDate(v.date)}`, restoreClient(prev), () => photosOf(v).forEach(delPhoto));
    };
  });
}

// ---------- wykrywanie duplikatów klientów ----------
const normTxt = t => String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l').replace(/[^a-z0-9]+/g, ' ').trim();
const normPhone = t => String(t || '').replace(/\D/g, '').replace(/^48(?=\d{9}$)/, '');
function findDupes(selfId, name, street, city, phone){
  const n = normTxt(name), st = normTxt(street), ct = normTxt(city), ph = normPhone(phone);
  const nWords = n.split(' ').filter(w => w.length > 1);
  return clients.filter(o => o.id !== selfId).map(o => {
    const why = [], on = normTxt(o.name);
    const oa = (o.street != null ? o.street : (o.address || '').split(',')[0]) || '', oc = (o.city != null ? o.city : (o.address || '').split(',').slice(1).join(',')) || '';
    if (n && on === n) why.push('to samo imię i nazwisko');
    else if (nWords.length >= 2 && nWords.every(w => on.split(' ').includes(w))) why.push('podobne imię i nazwisko');
    if (ph.length >= 9 && normPhone(o.phone) === ph) why.push('ten sam telefon');
    if (st && normTxt(oa) === st && (!ct || !normTxt(oc) || normTxt(oc) === ct)) why.push('ten sam adres');
    return why.length ? {o, why} : null;
  }).filter(Boolean);
}

    bindClr();
    $('dn').onchange = () => { keep(); draw(); };
    $('pd').onchange = () => { keep(); draw(); };
    const keep = () => { v.date = $('dt').value;
      if ($('dtt')) { v.time = $('dtt').value; v.team = readTeam(app); }
      if ($('vh')) { v.hours = parseH($('vh').value); v.helpers = keepPaidOut(readHelpers(app, v.hours), v.helpers); }
      if ($('rm')) v.remind = +$('rm').value; v.done = $('dn').checked; if (v.done) v.cancelled = false; v.desc = $('ds').value;
      v.amount = parseH($('am').value); v.paid = $('pd').checked;
      v.paidAt = v.paid ? (($('pdt') && $('pdt').value) || v.paidAt || v.date) : null; };
    const add = k => { keep(); const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.multiple = true;
      i.onchange = async () => { for (const f of i.files) { const id = newId(); await putPhoto(id, await shrink(f)); v[k].push(id); added.push(id); } draw(); };
      i.click(); };
    $('ab').onclick = () => add('before'); $('aa').onclick = () => add('after');
    if ($('cmpv')) $('cmpv').onclick = () => { keep(); compareView(v, c.name + ' · ' + shortDate(v.date)); };
    app.querySelectorAll('.photos img').forEach(im => im.onclick = () => { keep();
      const w = document.createElement('div');
      w.style.cssText = 'position:fixed;inset:0;background:#000e;z-index:9;display:flex;flex-direction:column;justify-content:center;padding:20px';
      w.innerHTML = `<img src="${im.src}" style="max-width:100%;max-height:75vh;object-fit:contain"><button class="btn del">Usuń zdjęcie</button><button class="btn sec">Zamknij</button>`;
      w.children[1].onclick = () => { const id = v[im.dataset.k].splice(+im.dataset.i, 1)[0];
        if (added.includes(id)) delPhoto(id); else removed.push(id); w.remove(); draw(); };
      w.children[2].onclick = () => w.remove(); document.body.appendChild(w); });
    $('s').onclick = () => { keep(); if (!v.date) return alert('Wybierz datę');
      const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v; else c.visits.push(v);
      if (!wasDone && v.done) addNext(c, v, plan0);
      removed.forEach(delPhoto); saveClient(c); back(); };
    const saveNow = () => { keep(); const i = c.visits.findIndex(x => x.id === v.id); if (i >= 0) c.visits[i] = v;
      removed.forEach(delPhoto); removed.length = 0; added.length = 0; saveClient(c); };
    if ($('mv')) $('mv').onclick = () => { saveNow(); moveDialog(c.id, v.id, back); };
    if ($('cx')) $('cx').onclick = () => {
      if (v.cancelled) { keep(); v.cancelled = false; saveNow(); return back(); }
      saveNow(); cancelDialog(c.id, v.id, back); };
    if (!isNew) $('d').onclick = () => {
      const prev = findClient(c.id); added.forEach(delPhoto); added.length = 0;
      c.visits = c.visits.filter(x => x.id !== v.id); saveClient(c); back();
      const gone = [...photosOf(prev.visits.find(x => x.id === v.id) || {}), ...removed];
      toastUndo(`Usunięto wizytę z ${shortDate(v.date)}`, restoreClient(prev), () => gone.forEach(delPhoto)); };
  };
  draw();
}
</script>
</body>
</html>
